name: spec-implement-mixed
description: Implement a spec with mixed models — sonnet plans, haiku executes, tests + gates verify. Same steps and gates as spec-implement at a fraction of the token cost.
tags: [spec, default, mixed-model]

# THROUGHPUT-DOC, REQ-THRU-004 — one source of truth for the implement
# pipeline. This variant inherits every node, gate and prompt from
# spec-implement and states only what differs: which model runs each step
# (MIXMODEL-DOC). Judgment steps are pinned up (sonnet); mechanical steps are
# pinned down (haiku); bash gates, approvals, verify, routing and coverage are
# model-free and identical by construction.
extends: spec-implement

node_overrides:
  fetch_spec:
    model: haiku      # mechanical: read the spec and summarize
  plan:
    model: sonnet     # judgment: the plan the human approves
  implement:
    model: haiku      # mechanical: execute the approved plan
  fix_quality:
    model: haiku      # mechanical: fix what the linter named
  link:
    model: haiku      # mechanical: record implementations bullets
  adversarial_review:
    model: sonnet     # judgment: try to break the change
