name: spec-verify
description: Run verification across all 'implemented' spec links. Use as a CI gate or pre-commit check.
tags: [spec, default, ci]
requires: [specship, tests]

# No worktree — runs in-place against the current checkout.
worktree:
  enabled: false

nodes:
  - id: run_tests
    kind: bash
    output_type: test_results
    timeout: 600000
    bash: |
      if [ -f package.json ]; then
        # Run against a built tree so a missing dist/ can't false-fail the
        # verify leg (WF-REJECT-DOC, REQ-WFREJ-005).
        npm run build --if-present
        npm test
      elif [ -f Cargo.toml ]; then
        cargo test
      elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
        python -m pytest
      else
        echo "no recognised test framework; skipping" >&2
        exit 0
      fi

  - id: summarize
    kind: prompt
    depends_on: [run_tests]
    output_type: link_summary
    trigger_rule: all_done
    allowed_tools:
      - mcp__specship__specship_drifted
      - mcp__specship__specship_spec
      - mcp__specship__specship_link_verify
    prompt: |
      Test run completed. Output (truncated):

      $run_tests.output

      Promotion is EVIDENCE-BASED (VERIFY-EVID-DOC): a spec may only become
      "verified" when a test linked to it as evidence passed. Evidence links
      have kind='tests' and come from a `verifies:` block in the spec or an
      `@verifies REQ-X` comment on the test. A green suite alone proves
      nothing about a spec with no linked tests — never blanket-promote.

      1. Call specship_drifted to see any drifted/broken/orphaned links.
      2. For each 'implemented' link whose spec HAS test-evidence links:
         if all of that spec's evidence tests passed in the output above,
         call specship_link_verify(result: "pass") to promote it.
         (specship_link_verify enforces the evidence gate and will refuse
         evidence-less promotion — do not work around the refusal.)
      3. For each FAILING test, demote only the specs that test evidences:
         call specship_link_verify(result: "fail", reason: "<test name>")
         on those specs' links. Do not touch specs the failing test is not
         linked to (REQ-VEVID-004).
      4. Specs with no evidence links stay 'implemented'. List them as
         "unevidenced" in your summary so the author can add `verifies:`
         blocks (REQ-VEVID-003).

      Output: a short summary — how many links moved to verified, how many
      to broken, which specs are unevidenced, and which are still drifted.
