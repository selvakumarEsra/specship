name: Dashboard e2e

# Boots the REAL dashboard server over the BUILT desktop SPA in a headless
# browser against a hermetic indexed fixture, then drives the app's core flows
# (REQ-DESKTOP-032): every routed screen renders its key content with zero
# console errors, spec edit→save persists to disk, theme persists across reload,
# and the command palette navigates. This is the guard the vitest suites can't
# see because they never boot the SPA in a browser — including the
# "dashboard opens blank / shows no data" CORS class of bug (e.g. #55).
#
# Runs on PRs that touch the SPA, server, CLI, or the harness itself.
# The Release workflow runs the same suite as a BLOCKING publish gate.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "ui/**"
      - "server/**"
      - "e2e/**"
      - "src/**"
      - "scripts/build-*.mjs"
      - "scripts/build-*.sh"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Root install compiles the optional better-sqlite3 (ships FTS5), which
      # the fixture indexer + the server's on-save re-sync need; the built-in
      # node:sqlite on Node 22 has no FTS5.
      - run: npm ci
      - name: Build CLI + server
        run: npm run build
      # The desktop SPA (ui/) is a standalone module with its own lockfile. The
      # harness serves this build via `serve --ui --no-ssr --web-dir ui/dist`.
      - name: Build desktop SPA
        run: cd ui && npm ci && npm run build
      - name: Install e2e deps + browser
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run dashboard e2e
        run: cd e2e && CI=1 npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
