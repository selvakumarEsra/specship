name: Retrieval evals

# Retrieval quality IS the product (CLAUDE.md, "Retrieval performance"): the bar
# is that an agent answers a structural question in a few fast specship calls
# with zero Read/Grep. A change to resolution, search, or the MCP surface can
# leave every unit test green while making the graph's *answers* worse — the
# evaluation suite (`__tests__/evaluation/`) is what sees that.
#
# So PRs touching those three trees run it as their own required job
# (REQ-TVIZ-005.A1). Path-filtered rather than folded into the unit workflow
# because it's slower and irrelevant to, say, an installer or docs change.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/resolution/**"
      - "src/search/**"
      - "src/mcp/**"
      - "__tests__/evaluation/**"
      - ".github/workflows/eval.yml"
  pull_request:
    paths:
      - "src/resolution/**"
      - "src/search/**"
      - "src/mcp/**"
      - "__tests__/evaluation/**"
      - ".github/workflows/eval.yml"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Evaluation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Root install compiles the optional better-sqlite3 (ships FTS5), which
      # the graph-backed evaluation cases need; Node 22's built-in node:sqlite
      # has none.
      - run: npm ci
      # The evaluation cases drive the built CLI/MCP surface, so build first —
      # same reason the unit workflow does.
      - name: Build CLI + server
        run: npm run build
      # Tee so the run is both visible in the job log and kept as an artifact
      # (A1: "results land in the job log/artifacts"). pipefail keeps the tee
      # from masking a failing suite.
      - name: Retrieval evals
        run: |
          set -o pipefail
          CI=1 npm run test:eval 2>&1 | tee eval-output.log
      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: eval-output.log
          retention-days: 14
