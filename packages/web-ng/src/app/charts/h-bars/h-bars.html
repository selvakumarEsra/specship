<div class="hbar-list">
  @for (it of items(); track it.name) {
    <button
      type="button"
      class="hbar-row"
      [class.selected]="selectedKey() === it.name"
      (click)="onClick(it)"
    >
      <span class="bar-label mono">{{ it.name }}</span>
      <span class="bar-track">
        <span class="bar-fill" [style.width.%]="width(it)" [style.background]="barColor(it)"></span>
      </span>
      <span class="bar-value mono">{{ fmtValue(it) }}</span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  }
</div>
