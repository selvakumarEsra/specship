<div class="topbar">
  <button class="ghost icon-btn" (click)="onMenuClick()" title="Toggle sidebar" aria-label="Toggle sidebar">
    <app-icon name="menu" [size]="16" />
  </button>
  <app-project-picker />
  <button class="palette-trigger" (click)="onPalette()" aria-label="Open command palette">
    <app-icon name="search" [size]="13" />
    <span>Search or jump to…</span>
    <kbd>⌘K</kbd>
  </button>
  <span class="grow"></span>
  <button class="ghost icon-btn" (click)="onToggleTheme()" [title]="'Theme: ' + effective()" aria-label="Toggle theme">
    <app-icon [name]="effective() === 'dark' ? 'sun' : 'moon'" [size]="16" />
  </button>
</div>
