@if (open()) {
  <div class="backdrop" (click)="onBackdrop($event)">
    <div class="palette">
      <div class="palette-header">
        <span>Jump to…</span>
        <kbd>esc</kbd>
      </div>
      <div class="palette-list scroll-y">
        @for (it of items; track it.id) {
          <button class="item" (click)="go(it.id)">
            <span class="label">{{ it.label }}</span>
            <span class="sub mono">{{ it.sub }}</span>
          </button>
        }
      </div>
    </div>
  </div>
}
