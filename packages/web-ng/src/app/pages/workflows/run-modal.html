<div class="rm-backdrop" (mousedown)="onBackdrop()">
  <div class="rm-panel" role="dialog" aria-modal="true" [attr.aria-label]="'Launch ' + workflow().name"
    (mousedown)="$event.stopPropagation()">

    <!-- header -->
    <div class="row gap-10 rm-head">
      <app-icon name="workflow" [size]="16" style="color: var(--accent);" />
      <span class="mono grow rm-name">{{ workflow().name }}</span>
      <button type="button" class="btn btn-ghost btn-xs" aria-label="Close" (click)="close.emit()">
        <app-icon name="x" [size]="14" />
      </button>
    </div>

    <!-- body -->
    <div class="rm-body">
      @if (workflow().description) {
        <div class="secondary rm-desc">{{ workflow().description }}</div>
      }

      @if (inputs().length) {
        @for (inp of inputs(); track inp.name) {
          <div class="rm-field">
            <label class="eyebrow rm-label" [attr.for]="'rm-' + inp.name">
              {{ inp.name }}@if (inp.required) { <span class="rm-req">*</span> }
            </label>
            <input class="input mono" [id]="'rm-' + inp.name" [placeholder]="placeholderFor(inp.name)"
              [value]="vals()[inp.name] || ''" (input)="setVal(inp.name, $any($event.target).value)" />
          </div>
        }
      } @else {
        <div class="muted rm-noinputs">No inputs required.</div>
      }

      @if (requires().length) {
        <div class="row gap-6 rm-requires">
          @for (r of requires(); track r) {
            <app-pill><app-icon name="check" [size]="10" /> {{ r }}</app-pill>
          }
        </div>
      }

      @if (error()) {
        <div class="row gap-8 rm-error">
          <app-icon name="drift" [size]="13" style="color: var(--error); flex-shrink: 0;" />
          <span>{{ error() }}</span>
        </div>
      }
    </div>

    <!-- footer -->
    <div class="row gap-8 rm-foot">
      <button type="button" class="btn btn-ghost btn-sm" (click)="close.emit()">Cancel</button>
      <button type="button" class="btn btn-primary btn-sm" [disabled]="launching()" (click)="launch()">
        <app-icon name="play" [size]="13" /> {{ launching() ? 'Launching…' : 'Launch run' }}
      </button>
    </div>
  </div>
</div>
