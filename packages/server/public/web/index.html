  <style>
    html.booted #boot-splash{display:none!important;}
    #boot-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
      background:radial-gradient(120% 90% at 50% 38%, rgba(59,130,246,0.10), transparent 60%),
        radial-gradient(80% 70% at 50% 60%, rgba(165,134,245,0.06), transparent 60%),#0B0D11;
      font-family:"Geist",system-ui,sans-serif;color:#E8EBF0;transition:opacity .55s ease;}
    #boot-splash.done{opacity:0;pointer-events:none;}
    #boot-splash .ambient{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(40% 32% at 50% 40%, rgba(91,147,242,0.12), transparent 70%);
      animation:bsBreathe 5.5s ease-in-out infinite;}
    @keyframes bsBreathe{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
    #boot-splash .splash{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2;}
    #boot-splash .markWrap{position:relative;width:170px;height:170px;display:grid;place-items:center;}
    #boot-splash .glowPad{position:absolute;width:64px;height:64px;border-radius:50%;
      background:radial-gradient(circle, rgba(91,147,242,0.6), transparent 70%);filter:blur(9px);
      left:71.8%;top:50%;transform:translate(-50%,-50%);opacity:.5;
      animation:bsLeadGlow 2.8s ease-in-out infinite;animation-delay:1.2s;}
    @keyframes bsLeadGlow{0%,100%{opacity:.35;}50%{opacity:.85;}}
    #boot-splash svg.mark{width:170px;height:170px;overflow:visible;}
    #boot-splash circle.node{transform-box:fill-box;transform-origin:center;}
    #boot-splash .edge{stroke:rgba(150,165,200,0.5);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;}
    #boot-splash .splash.play circle.node{animation:bsPop .55s cubic-bezier(.34,1.56,.64,1) both;}
    #boot-splash .splash.play .n-route{animation-delay:.05s;}
    #boot-splash .splash.play .n-code{animation-delay:.42s;}
    #boot-splash .splash.play .n-test{animation-delay:.52s;}
    #boot-splash .splash.play .n-lead{animation-delay:.92s;animation-duration:.6s;}
    @keyframes bsPop{0%{transform:scale(0);}70%{transform:scale(1.18);}100%{transform:scale(1);}}
    #boot-splash .splash.play .e-wake{stroke-dasharray:7;animation:bsDraw .35s ease both;animation-delay:.18s;--len:7;}
    #boot-splash .splash.play .e-spine{stroke-dasharray:15;animation:bsDraw .4s ease both;animation-delay:.3s;--len:15;}
    #boot-splash .splash.play .e-up{stroke-dasharray:14.5;animation:bsDraw .45s ease both;animation-delay:.55s;--len:14.5;}
    #boot-splash .splash.play .e-down{stroke-dasharray:14.5;animation:bsDraw .45s ease both;animation-delay:.62s;--len:14.5;}
    @keyframes bsDraw{from{stroke-dashoffset:var(--len,15);}to{stroke-dashoffset:0;}}
    #boot-splash .sonar{transform-box:fill-box;transform-origin:center;opacity:0;}
    #boot-splash .splash.lit .sonar{animation:bsSonar 2.6s ease-out infinite;animation-delay:1.4s;}
    @keyframes bsSonar{0%{transform:scale(.5);opacity:.6;}80%{opacity:0;}100%{transform:scale(2.6);opacity:0;}}
    #boot-splash .streak{opacity:0;}
    #boot-splash .splash.lit .streak{animation:bsStreak 2.4s ease-out infinite;}
    #boot-splash .splash.lit .s1{animation-delay:1.5s;}
    #boot-splash .splash.lit .s2{animation-delay:1.62s;}
    #boot-splash .splash.lit .s3{animation-delay:1.74s;}
    @keyframes bsStreak{0%{opacity:0;transform:translateX(0);}25%{opacity:.7;}100%{opacity:0;transform:translateX(7px);}}
    #boot-splash .word{margin-top:18px;font-size:30px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:baseline;}
    #boot-splash .word .desk{color:#8A93A3;font-weight:500;}
    #boot-splash .splash.play .word{animation:bsRise .7s cubic-bezier(.2,.7,.3,1) both;animation-delay:.95s;}
    @keyframes bsRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    #boot-splash .status{margin-top:26px;height:18px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8A93A3;font-family:"Geist Mono",monospace;}
    #boot-splash .splash.play .status{animation:bsFade .5s ease both;animation-delay:1.5s;}
    @keyframes bsFade{from{opacity:0;}to{opacity:1;}}
    #boot-splash .status .dot{width:6px;height:6px;border-radius:50%;background:#5B93F2;box-shadow:0 0 8px #5B93F2;animation:bsBlink 1s ease-in-out infinite;}
    @keyframes bsBlink{0%,100%{opacity:.35;}50%{opacity:1;}}
    #boot-splash .status .ok{color:#46C26B;}
    #boot-splash .bar{margin-top:22px;width:200px;height:2px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;}
    #boot-splash .splash.play .bar{animation:bsFade .5s ease both;animation-delay:1.5s;}
    #boot-splash .bar::after{content:"";display:block;height:100%;width:40%;border-radius:2px;
      background:linear-gradient(90deg,transparent,#5B93F2,transparent);animation:bsSlide 1.5s ease-in-out infinite;}
    @keyframes bsSlide{0%{transform:translateX(-120%);}100%{transform:translateX(320%);}}
    #boot-splash .ver{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:#5C6573;font-family:"Geist Mono",monospace;}
    @media(prefers-reduced-motion:reduce){#boot-splash *{animation:none!important;}}
  </style>

  <script>
  (function(){
    var el = document.getElementById('boot-splash');
    if(!el) return;
    if(document.documentElement.classList.contains('booted')){ el.parentNode.removeChild(el); return; }
